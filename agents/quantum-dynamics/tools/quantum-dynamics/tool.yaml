name: quantumDynamics
description: Evolve a small pure state under a time-independent Hermitian Hamiltonian.
version: 0.1.0
category: Quantum Computing
license: MIT
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/quantum-dynamics:0.1.0'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 4Gi
      gpu: 0
    max_resources:
      cpu: 1
      ram: 2Gi
      storage: 4Gi
      gpu: 0
actions:
- name: dynamics
  description: Evolve a small pure state under a time-independent Hermitian Hamiltonian.
  infra_node: worker
  input_schema:
    type: object
    properties:
      request_json:
        type: string
        minLength: 2
        maxLength: 65536
        description: UTF-8 JSON request for this operation only. Specify n_qubits, Pauli terms, energy_unit
          rad/s, a unit-norm state with real and optional imag arrays, and 1 to 256 nonnegative strictly
          increasing times_s. Basis bit strings are lexicographic.
    required:
    - request_json
  inline_files:
  - mount_path: /input/request.json
    content: '{{request_json}}'
  command: --request /input/request.json --output /output
  output_mount_configurations:
  - mount_path: /output
    output_name: referenceResult
    output_description: JSON result with operation, provenance and scientific limits, or structured failure.
    auto_promote: false
