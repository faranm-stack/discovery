name: quantumResources
description: Calculate transparent resource accounting from explicitly supplied architecture assumptions.
version: 0.1.0
category: Quantum Computing
license: MIT
infra:
- name: worker
  infra_type: container
  image:
    acr: '{name}.azurecr.io/quantum-resources:0.1.0'
  compute:
    min_resources:
      cpu: 1
      ram: 2Gi
      storage: 4Gi
      gpu: 0
    max_resources:
      cpu: 1
      ram: 2Gi
      storage: 4Gi
      gpu: 0
actions:
- name: resources
  description: Calculate transparent resource accounting from explicitly supplied architecture assumptions.
  infra_node: worker
  input_schema:
    type: object
    properties:
      request_json:
        type: string
        minLength: 2
        maxLength: 65536
        description: UTF-8 JSON request for this operation only. logical_qubits and physical_per_logical
          are positive integers; factory_qubits and logical_depth are nonnegative integers. cycle_time_s
          is a positive duration in seconds.
    required:
    - request_json
  inline_files:
  - mount_path: /input/request.json
    content: '{{request_json}}'
  command: --request /input/request.json --output /output
  output_mount_configurations:
  - mount_path: /output
    output_name: referenceResult
    output_description: JSON result with operation, provenance and scientific limits, or structured failure.
    auto_promote: false
