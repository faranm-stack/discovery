name: Catalog Live Pilot (Studio)

# Runs the pilot agents through Discovery Studio, builds a report card, and optionally syncs failures to ADO.
# Auth is OIDC to the Entra app discovery-catalog-ci; no stored secret. The catalog-live environment
# requires a reviewer, so every run is approved by a person before it spends compute.
on:
  workflow_dispatch:
    inputs:
      list:
        description: Agent list to run
        type: choice
        options: [live-catalog.csv, pilot.csv, retry-inputs.csv]
        default: live-catalog.csv
      only:
        description: Run a single agent (blank = whole list)
        default: ''
      go:
        description: Start real Studio turns (otherwise preflight and dry run only)
        type: boolean
        default: false
      parallel:
        description: Agents to run at the same time (1-8)
        default: '4'

permissions:
  contents: read
  id-token: write

concurrency:
  group: catalog-live
  cancel-in-progress: false

jobs:
  pilot:
    environment: catalog-live
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CATALOG_EVIDENCE_DIR: ${{ github.workspace }}/evidence
      LIST: ${{ inputs.list || 'live-catalog.csv' }}
      GO: ${{ github.event_name == 'schedule' || inputs.go }}
      ONLY: ${{ inputs.only }}
      PARALLEL: ${{ inputs.parallel || '4' }}
      MODEL_PRICE_IN: ${{ vars.MODEL_PRICE_IN }}
      MODEL_PRICE_OUT: ${{ vars.MODEL_PRICE_OUT }}
      STUDIO_URL: ${{ vars.STUDIO_URL }}
      DISCOVERY_PROJECT: ${{ vars.DISCOVERY_PROJECT || 'weekly-agent-svc-test' }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      DISCOVERY_RESOURCE_GROUP: ${{ vars.DISCOVERY_RESOURCE_GROUP }}
      DISCOVERY_SUPERCOMPUTER: ${{ vars.DISCOVERY_SUPERCOMPUTER }}
      DISCOVERY_WORKSPACE_ENDPOINT: ${{ vars.DISCOVERY_WORKSPACE_ENDPOINT }}
      DISCOVERY_STORAGE_CONTAINER: ${{ vars.DISCOVERY_STORAGE_CONTAINER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Preflight and Studio turns
        shell: pwsh
        run: |
          $a = @{ PilotCsv = "./.github/catalog-live/$env:LIST" }
          if ($env:GO -eq 'true') { $a.Go = $true }
          if ($env:ONLY) { $a.Only = $env:ONLY }
          $a.Parallel = [int]$env:PARALLEL
          ./.github/catalog-live/Start-PilotRun.ps1 @a
      - name: Report card
        if: always() && env.GO == 'true'
        run: |
          # Prices default to Azure list prices in the script; repo variables override them.
          extra=()
          if [ -n "$MODEL_PRICE_IN" ]; then extra+=(--price-in "$MODEL_PRICE_IN"); fi
          if [ -n "$MODEL_PRICE_OUT" ]; then extra+=(--price-out "$MODEL_PRICE_OUT"); fi
          if [ -n "$STUDIO_URL" ]; then extra+=(--studio-url "$STUDIO_URL"); fi
          python .github/catalog-live/build_live_report_card.py --evidence "$CATALOG_EVIDENCE_DIR" \
            --pilot ".github/catalog-live/$LIST" --only "$ONLY" --out report-card "${extra[@]}"
          cat report-card/report-card.md >> "$GITHUB_STEP_SUMMARY"
      # Only the report card is published. Agent output stays in Studio (private to the workspace).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: report-card-${{ github.run_id }}
          path: report-card/
          if-no-files-found: ignore
