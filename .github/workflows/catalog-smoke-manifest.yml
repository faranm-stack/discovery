name: Catalog Smoke Manifest (Dry Run)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for generating the smoke manifest"
        required: false
        default: "Review catalog smoke coverage"
        type: string

permissions:
  contents: read

jobs:
  generate:
    name: Validate catalog and generate smoke candidates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt

      - name: Install validation dependencies
        run: python -m pip install -r .github/requirements-ci.txt

      - name: Generate dry-run manifest
        run: |
          python .github/scripts/generate_smoke_manifest.py \
            --repo-root . \
            --output-dir "$RUNNER_TEMP/catalog-smoke"

      - name: Publish job summary
        if: always()
        run: |
          summary="$RUNNER_TEMP/catalog-smoke/smoke-manifest.md"
          if [ -f "$summary" ]; then
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No smoke manifest was produced._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catalog-smoke-manifest
          path: ${{ runner.temp }}/catalog-smoke/
          if-no-files-found: error
          retention-days: 30